<div class="app-shell">

      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <span i18n="@@appNavHome">Home</span>
      </a>
      <a routerLink="/projects" routerLinkActive="is-active" i18n="@@appNavProjects">Projects</a>

  <main class="app-content">

</div>
