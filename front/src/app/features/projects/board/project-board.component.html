<main>
  @if (project(); as p) {
    <p><a routerLink="/projects" i18n="@@projectBoardBackToProjects">← Projects</a></p>
    <h2>{{ p.name }}</h2>
    @if (p.description) {
      <p class="muted">{{ p.description }}</p>
    }
    @if (p.author) {
      <p class="muted">{{ p.author }}</p>
    }
    <button type="button" class="edit-project-btn" (click)="toggleProjectEdit()">
      @if (isProjectEditOpen()) {
        <span i18n="@@projectBoardCancelEditProject">Cancel edit</span>
      } @else {
        <span i18n="@@projectBoardEditProject">Edit project</span>
      }
    </button>
    @if (isProjectEditOpen()) {
      <form class="project-edit" [formGroup]="projectEditForm" (ngSubmit)="saveProjectEdit()">
        <input formControlName="name" placeholder="Project name" i18n-placeholder="@@projectBoardProjectNamePlaceholder" />
        <input
          formControlName="description"
          placeholder="Description (optional)"
          i18n-placeholder="@@projectBoardProjectDescriptionPlaceholder"
        />
        <input formControlName="author" placeholder="Author (optional)" i18n-placeholder="@@projectBoardProjectAuthorPlaceholder" />
        <button type="submit" [disabled]="projectEditForm.invalid || projectEditForm.pristine" i18n="@@projectBoardSaveProject">
          Save project
        </button>
      </form>
    }

    <input
      [formControl]="searchControl"
      placeholder="Search tasks by title"
      i18n-placeholder="@@projectBoardSearchPlaceholder"
      class="search"
    />
    <div class="filters">
      <select [formControl]="priorityFilterControl">
        <option value="" i18n="@@projectBoardAllPriorities">All priorities</option>
        <option value="low" i18n="@@taskPriorityLow">low</option>
        <option value="medium" i18n="@@taskPriorityMedium">medium</option>
        <option value="high" i18n="@@taskPriorityHigh">high</option>
      </select>
      <select [formControl]="tagFilterControl">
        <option value="" i18n="@@projectBoardAllTags">All tags</option>
        @for (tag of availableTags(); track tag) {
          <option [value]="tag">{{ tag }}</option>
        }
      </select>
      <label class="overdue">
        <input type="checkbox" [formControl]="overdueOnlyControl" />
        <span i18n="@@projectBoardOverdueOnly">overdue only</span>
      </label>
    </div>

    <app-task-board
      [projectId]="p.id"
      [searchTerm]="searchTerm()"
      [priorityFilter]="priorityFilter()"
      [tagFilter]="tagFilter()"
      [overdueOnly]="overdueOnly()"
    />

    <button #openTaskDialogButton type="button" class="open-add-task" (click)="openTaskDialog(openTaskDialogButton)">
      <span i18n="@@projectBoardOpenAddTaskButton">Add task</span>
    </button>

    @if (isTaskDialogOpen()) {
      <app-task-create-dialog (submitTask)="createTask($event)" (cancel)="closeTaskDialog()" />
    }
  } @else {
    <p i18n="@@projectBoardNotFound">Project not found.</p>
    <a routerLink="/projects" i18n="@@projectBoardBackToList">Back to list</a>
  }
</main>
