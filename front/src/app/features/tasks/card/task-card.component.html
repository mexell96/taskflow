<div class="card">
  <div class="head">
    <strong>{{ task().title }}</strong>
    <span class="pr">{{ task().priority }}</span>
  </div>
  @if (task().description) {
    <p class="description">{{ task().description }}</p>
  }
  @if (task().dueDate) {
    <p class="due-date"><span i18n="@@taskCardDueLabel">due:</span> {{ task().dueDate | date: 'dd.MM.yyyy' }}</p>
  }
  @if (task().tags.length) {
    <p class="tags">{{ task().tags.join(', ') }}</p>
  }
  <label>
    <span i18n="@@taskCardStatusLabel">Status</span>
    <select
      #statusSelect
      [ngModel]="task().status"
      (ngModelChange)="onStatus($event)"
      [disabled]="!canChangeTaskStatus()"
    >
      <option value="backlog" i18n="@@taskStatusBacklog">backlog</option>
      <option value="in_progress" i18n="@@taskStatusInProgress">in_progress</option>
      <option value="review" i18n="@@taskStatusReview">review</option>
      <option value="done" i18n="@@taskStatusDone">done</option>
    </select>
  </label>
  @if (canEditTask()) {
    <button type="button" class="edit-btn" (click)="startEdit()">
      @if (isEditOpen()) {
        <span i18n="@@taskCardCancelEdit">Cancel</span>
      } @else {
        <span i18n="@@taskCardEdit">Edit</span>
      }
    </button>
  }

  @if (canEditTask() && isEditOpen()) {
    <form class="edit-form" [formGroup]="editForm" (ngSubmit)="saveEdit()">
      <input formControlName="title" placeholder="Title" i18n-placeholder="@@taskCardTitlePlaceholder" />
      <input
        formControlName="description"
        placeholder="Description (optional)"
        i18n-placeholder="@@taskCardDescriptionPlaceholder"
      />
      <select formControlName="priority">
        <option value="low" i18n="@@taskPriorityLow">low</option>
        <option value="medium" i18n="@@taskPriorityMedium">medium</option>
        <option value="high" i18n="@@taskPriorityHigh">high</option>
      </select>
      <input formControlName="dueDate" type="date" />
      <input formControlName="tags" placeholder="tags,comma,separated" i18n-placeholder="@@taskTagsPlaceholder" />
      <div class="edit-actions">
        <button type="submit" [disabled]="editForm.invalid || editForm.pristine" i18n="@@taskCardSaveButton">Save</button>
        <button type="button" (click)="cancelEdit()" i18n="@@taskCardCancelButton">Cancel</button>
      </div>
    </form>
  }
</div>
